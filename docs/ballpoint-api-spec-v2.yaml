          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/partner/funnel-events:
    post:
      tags:
      - Partner Funnel Events
      summary: Record an automatic iframe funnel milestone
      operationId: record_partner_funnel_event
      description: |
        Log-only, best-effort telemetry emitted automatically by the embedded
        iframe. Partners do not call this endpoint and do not need to change
        their integration. Each POST contains exactly one funnel milestone and
        is capped at 2048 bytes. Accepted events do not create database rows,
        emit webhooks, or change campaign/order state.

        The endpoint accepts 1,000 attempts with valid partner and user context
        per 60 seconds for each account/source/external-account tuple, enforced
        per API process. Its empty 429 response does not include the general
        API rate-limit headers or Retry-After.

        Account and tenant/source identity are derived from the authenticated
        partner principal. User context is derived from X-External-User-ID;
        identity fields are not accepted in the JSON body. The closed schema
        accepts no recipient PII or typed copy.

        submit_clicked may repeat when payment is reopened.
        campaign_submitted_confirmed is emitted by the iframe only as its
        post-payment-success milestone. Drop-off is derived downstream from
        the last event received for a session; it is not a separate event.

        This contract is prepared for local and staging validation. Inclusion
        in this specification does not assert staging runtime deployment or
        production availability.
      security:
      - partnerKeyAuth: []
      parameters:
      - name: X-External-User-ID
        in: header
        required: true
        description: Partner user ID used for server-side event attribution. It must not also be sent in the JSON body.
        schema:
          type: string
          minLength: 1
          maxLength: 100
      requestBody:
        required: true
        description: Exactly one funnel event. The raw request body must not exceed 2048 bytes.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerFunnelEvent'
            example:
              event: product_selected
              session_id: sfe_9f2a1c4b7e3d0a11
              sequence: 2
              elapsed_ms_client: 4230
              page_id: products
              flow_type: single
      responses:
        '204':
          description: Event accepted and written to structured logs. Empty response body.
        '401':
          description: Missing or invalid partner identity headers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body exceeds 2048 bytes. Empty response body.
        '422':
          description: Invalid, unknown, or extra payload field. Empty response body.
        '429':
          description: Endpoint-specific 1,000-attempt/60-second per-process tenant limit exceeded. Empty body; no general rate-limit headers or Retry-After.
