openapi: 3.1.0
info:
  title: Ballpoint Marketing API (v1, staging)
  version: 3.1.0
  x-partner-contract-version: 1.7.33
  description: "This spec documents the v1 API as deployed on staging. Production and v2 are out of scope.\n\nDirect mail automation API for programmatic postcard, letter, and campaign delivery.\n\n## Authentication\n\nTwo authentication methods are supported:\n\n### Bearer JWT (live/test principals)\n```bash\ncurl https://staging-api.ballpointmarketing.com/orders \\\n  -H \"Authorization: Bearer eyJhbG...\"\n```\n\n### Partner Key (platform integrations)\n```bash\ncurl https://staging-api.ballpointmarketing.com/orders \\\n  -H \"X-Partner-Key: pk_test_PARTNER_REPLACE_ME\"\n```\n\n## Principal Types\n\n| Type | Auth Method | Permissions |\n|------|-------------|-------------|\n| `live` | Bearer JWT | Full access to own account |\n| `test` | Bearer JWT | Sandbox only, no real mail |\n| `partner` | X-Partner-Key | Scoped to source + external_account_id |\n\n## Integration Identity\n\nPartner integrations use identity fields to scope resources:\n\n- `source`: Integration identifier assigned during onboarding\n- `external_account_id`: Partner's tenant/customer ID\n- `external_user_id`: Partner's user ID within tenant\n- `external_id`: Partner's ID for the resource\n\n## Error Handling\n\nAll errors return a consistent envelope with trace ID for debugging:\n\n```json\n{\n  \"error\": {\n    \"type\": \"validation_error\",\n    \"code\": \"INVALID_ADDRESS\",\n    \"message\": \"Address could not be verified\",\n    \"details\": { \"field\": \"to_address_line1\" },\n    \"trace_id\": \"tr_abc123\"\n  }\n}\n```\n\n## Idempotency\n\n`Idempotency-Key` header is REQUIRED for `POST /orders` (returns 400 if missing):\n\n- Keys are scoped to principal + key; endpoint is enforced via request hash (method + path + body)\n- TTL: 24 hours\n- Matching key + different body = `422 Unprocessable Entity`\n- Matching key + same body = cached response replayed\n\n## Versioning\n\n- REST API: URL versioning (`/v1/...`)\n- Partner contract: `1.7.33`; webhook bodies are governed by the canonical JSON Schemas referenced below\n- API follows semantic versioning (MAJOR.MINOR.PATCH)\n\n    \n    ## Mail Tracking (v2.0)\n    \n    USPS IV-MTR scan data integration for piece-level mail tracking.\n    Upload Accuzip manifests, receive scan events via SFTP, and query\n    campaign-level and piece-level delivery status.\n    \n    See endpoints tagged `Mail Tracking` below.\n\n    \n    ## CORS\n    \n    API supports CORS for browser-based dashboard access. Allowed origins\n    configured via `CORS_ALLOWED_ORIGINS` environment variable.\n    \n    Exposed response headers: `X-Trace-Id`, `X-Request-Id`\n    \n    ## Rate Limiting\n    \n    All endpoints are rate-limited per principal (auth key) with IP fallback.\n    Read endpoints: 60 req/min. Ingest endpoints: 10 req/min.\n    Per-account limits (RPM, RPD, daily piece cap) are also enforced.\n    \n    Rate limit headers on all responses:\n    - `X-RateLimit-Remaining`: requests remaining in window\n    - `Retry-After`: seconds until reset (on 429 only)\n    \n    ## Webhook Security\n    \n    Webhook payloads are signed with HMAC-SHA256. Verify using:\n    - `X-Ballpoint-Signature`: `sha256=<hex>` — HMAC of `timestamp header + exact raw body bytes`\n    - `X-Ballpoint-Timestamp`: ISO 8601 timestamp (reject if > 5 minutes old)\n    - `X-Ballpoint-Event-Id`: stable event ID for deduplication across retries/endpoints\n    - `X-Ballpoint-Delivery`: unique delivery attempt ID\n    \n    Secret rotation: set `WEBHOOK_SECRET_NEXT` during rotation. Both secrets\n    are tried during verification for overlap window.\n"
  contact:
    name: Ballpoint API Support
    email: api-support@ballpointmarketing.com
  license:
    name: Proprietary
servers:
- url: https://staging-api.ballpointmarketing.com
  description: Staging
tags:
- name: Orders
  description: Single-piece mail orders
- name: Campaigns
  description: Bulk mail campaigns with recipient lists
- name: Addresses
  description: Address verification
- name: Webhooks
  description: Event notifications
- name: Reconciliation
  description: Partner debugging and support
- name: Sandbox
  description: Testing and integration validation
- name: Partner Configuration
  description: Partner-authenticated feature configuration bootstrap
- name: Partner Funnel Events
  description: Automatic log-only telemetry emitted by the embedded iframe
- name: Mail Tracking
  description: USPS mail tracking — campaign summary, piece-level status, scan events, RTS suppression
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT token for live/test principals. Obtain from the Ballpoint dashboard.

        ```

        Authorization: Bearer eyJhbG...

        ```

        '
    partnerKeyAuth:
      type: apiKey
      in: header
      name: X-Partner-Key
      description: 'Partner integration key.

        Scoped to source + external_account_id.

        ```

        X-Partner-Key: pk_test_PARTNER_REPLACE_ME

        ```

        '
  headers:
    X-Trace-Id:
      description: Unique trace ID for debugging
      schema:
        type: string
    Idempotency-Key:
      description: Idempotency key for request deduplication
      schema:
        type: string
        maxLength: 64
    RateLimit-Limit:
      description: Request limit per window
      schema:
        type: integer
    RateLimit-Remaining:
      description: Remaining requests in window
      schema:
        type: integer
    RateLimit-Reset:
      description: Window reset time (Unix timestamp)
      schema:
        type: integer
    X-RateLimit-Remaining:
      description: Number of requests remaining in current window
      schema:
        type: integer
    Retry-After:
      description: Seconds until rate limit resets (present on 429 responses)
      schema:
        type: integer
    X-Ballpoint-Signature:
      description: 'HMAC-SHA256 signature: sha256=<hex>. Verify with webhook secret.'
      schema:
        type: string
        example: sha256=a1b2c3d4...
    X-Ballpoint-Event:
      description: Webhook event type (e.g., tracking.status_changed)
      schema:
        type: string
    X-Ballpoint-Event-Id:
      description: Unique event ID for deduplication
      schema:
        type: string
        format: uuid
    X-Ballpoint-Delivery:
      description: Unique delivery attempt ID
      schema:
        type: string
        format: uuid
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - type
          - code
          - message
          properties:
            type:
              type: string
              enum:
              - validation_error
              - authentication_error
              - authorization_error
              - not_found
              - conflict
              - rate_limit_error
              - server_error
            code:
              type: string
              description: Machine-readable error code
              enum:
              - INVALID_ADDRESS
              - ADDRESS_UNDELIVERABLE
              - INVALID_PDF
              - INVALID_STATUS_TRANSITION
              - AMBIGUOUS_LOOKUP
              - IDEMPOTENCY_CONFLICT
              - INSUFFICIENT_BALANCE
              - INVALID_PIECE_COUNT
              - RATE_LIMITED
              - NOT_FOUND
              - UNAUTHORIZED
              - FORBIDDEN
              - FEATURE_DISABLED
            message:
              type: string
              description: Human-readable error message
            details:
              type: object
              description: Additional error context
            trace_id:
              type: string
              description: Request trace ID for support
    PartnerConfigResponse:
      type: object
      required:
      - flags
      - evaluated_at
      - evaluation_context
      - cache_ttl_seconds
      properties:
        flags:
          type: object
          description: Boolean-only feature flags resolved for this partner context.
          additionalProperties:
            type: boolean
          example:
            propstream_send_mail_enabled: false
        evaluated_at:
          type: string
          format: date-time
        evaluation_context:
          $ref: '#/components/schemas/PartnerConfigEvaluationContext'
        cache_ttl_seconds:
          type: integer
          const: 60
    PartnerConfigEvaluationContext:
      type: object
      required:
      - principal_type
      - source
      - kill_switch_engaged
      properties:
        principal_type:
          type: string
          const: partner
        source:
          type: string
          example: propstream
        kill_switch_engaged:
          type: boolean
      description: Contains no raw or hashed user/account identifier.
    PartnerFunnelEvent:
      type: object
      additionalProperties: false
      required:
      - event
      - session_id
      - sequence
      - elapsed_ms_client
      - page_id
      properties:
        event:
          type: string
          enum:
          - campaign_started
          - product_selected
          - copy_edited
          - proof_viewed
          - submit_clicked
          - campaign_submitted_confirmed
          description: Funnel milestone. submit_clicked may repeat after a payment handoff is reopened; campaign_submitted_confirmed is emitted only after payment success.
        session_id:
          type: string
          pattern: ^sfe_[a-f0-9]{16}$
          maxLength: 20
          example: sfe_9f2a1c4b7e3d0a11
          description: Ephemeral campaign-session identifier generated by the iframe.
        sequence:
          type: integer
          minimum: 1
          maximum: 50
          description: Monotonically increasing event sequence within the campaign session.
        elapsed_ms_client:
          type: integer
          minimum: 0
          maximum: 86400000
          description: Client-observed milliseconds since the campaign session started.
        page_id:
          type: string
          pattern: ^[a-z0-9-]+$
          maxLength: 40
          description: Safe iframe page identifier; never a URL or free-form user value.
        flow_type:
          type: string
          enum:
          - single
          - multi
          - split
          description: Optional campaign flow classification.
    BillingOrderCreateRequest:
      type: object
      required:
      - campaign_id
      - product_type
      - postage_type
      - piece_count
      properties:
        campaign_id:
          type: string
        product_type:
          type: string
        postage_type:
          type: string
        piece_count:
          type: integer
          minimum: 1
        envelope_style:
          type:
          - string
          - 'null'
        external_user_id:
          type:
          - string
          - 'null'
        external_user_metadata:
          type:
          - object
          - 'null'
          additionalProperties: true
        metadata:
          type:
          - object
          - 'null'
          additionalProperties: true
        print_font:
          type:
          - string
          - 'null'
        shipping_option:
          type:
          - string
          - 'null'
    PricingRow:
      type: object
      description: 'One row in the pricing catalog response from `GET /v1/billing/pricing`. For partner principals with a configured markup, `unit_price_tcents` is the marked-up (retail) price shown to end users; internal/live/test principals see base prices. Dollars = tcents / 10000.'
      required:
      - product_type
      - postage_type
      - unit_price_tcents
      - min_quantity
      - sla_business_days
      properties:
        product_type:
          type: string
          description: 'Product identifier (e.g. `4x6_printed`, `6x9_cursive`, `color_letter`, `hybrid_letter`, `greeting_letter`).'
        postage_type:
          type: string
          description: 'Postage tier for this row (e.g. `first_class`, `standard`, `presort`). Varies by product.'
        unit_price_tcents:
          type: integer
          description: Per-piece price in tenth-cents. Divide by 10,000 for dollars.
        min_quantity:
          type: integer
          description: Minimum piece_count this pricing row applies to.
        max_quantity:
          type: integer
          nullable: true
          description: Maximum piece_count this pricing row applies to. `null` = no upper bound.
        description:
          type: string
          nullable: true
          description: Human-readable description of the row.
        sla_business_days:
          type: integer
          minimum: 1
          maximum: 15
          description: 'Business days of production lead time between the scheduled production start date and `mail_date` for this product type. Current policy: printed postcards = 3, cursive/written postcards = 4, all letters = 6; range 1-15. Identical across postage variants of the same product. This value is a UX affordance so partners can render an accurate date-picker minimum. It is not currently enforced server-side at order creation — server-side enforcement is planned separately. Added in v1.7.7; current 3/4/6 policy effective in v1.7.28.'
    OrderDetail:
      type: object
      description: 'Response shape for `GET /v1/billing/orders/{order_id}` and each element of `GET /v1/billing/orders`. Source of truth: `_format_order_row` (billing_router.py). Status fields are documented as plain strings because the live enum sets are owned by the API and can evolve; partners should treat them as opaque values.'
      properties:
        id:
          type: string
          pattern: ^ord_[a-zA-Z0-9]+$
        campaign_id:
          type: string
        account_id:
          type: string
        source:
          type: string
          nullable: true
        external_account_id:
          type: string
          nullable: true
        external_user_id:
          type: string
          nullable: true
        product_type:
          type: string
        postage_type:
          type: string
        piece_count:
          type: integer
        unit_price_tcents:
          type: integer
          description: Unit price in tenths of a cent.
        total_price_tcents:
          type: integer
          description: Total price in tenths of a cent.
        production_status:
          type: string
        usps_status:
          type: string
          nullable: true
        display_status:
          type: string
          description: Aggregated status surfaced to the partner.
        envelope_style:
          type: string
          nullable: true
        print_font:
          type: string
          nullable: true
        shipping_option:
          type: string
          nullable: true
        proof_approval_status:
          type: string
          nullable: true
        metadata:
          type: string
          nullable: true
          description: JSON-encoded metadata object string; parse as JSON if you need nested metadata. Matches GET /v1/billing/orders list behavior. May include `variant` (`"a"`/`"b"`, A/B split sibling orders only — see `PartnerOrderCreateRequest.variant`), `deliver_to` (`"mailing"`/`"property"`/`"both"`, recipient routing selection from POST /orders), and `remove_duplicate_addresses` (boolean, recipient dedupe selection from POST /orders). All three are optional and additive — absent when the corresponding POST field was not supplied.
        customer_info:
          type: object
          nullable: true
          description: Nested customer info. `null` when no `customer_*` columns are populated; otherwise an object with the populated subset of the five fields below (absent keys mean "not set").
          properties:
            name:
              type: string
              nullable: true
            website:
              type: string
              nullable: true
            rma:
              type: string
              nullable: true
            phone:
              type: string
              nullable: true
            shipping_address:
              type: string
              nullable: true
        sla_due_at:
          type: string
          format: date-time
          nullable: true
        priority:
          type: string
          nullable: true
        render_status:
          type: string
          nullable: true
        status_changed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    MailTrackingSummary:
      type: object
      description: Campaign-level mail tracking summary. Safe for all principal types — no PII.
      properties:
        campaign_id:
          type: string
        mail_status:
          type: string
          enum:
          - shipped
          - in_transit
          - out_for_delivery
          - delivered
        mail_status_label:
          type: string
        total_pieces:
          type: integer
        scanned_pieces:
          type: integer
        delivered:
          type: integer
        in_transit:
          type: integer
        out_for_delivery:
          type: integer
        rts:
          type: integer
        forwarded:
          type: integer
        delivered_rate:
          type: number
          format: float
        scan_coverage:
          type: number
          format: float
        rts_rate:
          type: number
          format: float
        first_scan_at:
          type: string
          format: date-time
          nullable: true
        last_scan_at:
          type: string
          format: date-time
          nullable: true
        last_delivered_at:
          type: string
          format: date-time
          nullable: true
        last_updated_at:
          type: string
          format: date-time
          nullable: true
        status_version:
          type: string
    RecipientContactRef:
      type: object
      description: Partner contact reference for a piece affected by a recipient opt-out toggle. `contact_id` is the partner-supplied opaque identifier echoed verbatim from the original recipient upload; `contact_type` disambiguates two pieces sharing the same `contact_id` (`PROPERTY` vs `MAILING`).
      required:
      - contact_id
      properties:
        contact_id:
          type: string
          description: Partner-supplied opaque contact identifier, echoed verbatim from the original recipient upload.
          example: ps_contact_8821
        contact_type:
          type: string
          nullable: true
          enum:
          - PROPERTY
          - MAILING
          description: Address type as supplied by the partner on the original recipient upload. `null` when no address-type was supplied.
          example: PROPERTY
    RecipientCampaignAppearance:
      type: object
      required:
      - campaign_id
      properties:
        campaign_id:
          type: string
        campaign_name:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        mail_date:
          type: string
          nullable: true
        last_scan_at:
          type: string
          format: date-time
          nullable: true
        piece_status:
          type: string
          nullable: true
        variant:
          type:
          - string
          - "null"
          enum:
          - a
          - b
          - null
          description: >-
            A/B split-test variant this recipient was mailed under. Null for
            single-send and multi-send campaigns, and null when the recipient's
            appearances in this campaign disagree on a variant — a wrong
            attribution is worse than none. An appearance carrying no variant
            does not conflict.
    RecipientSearchResult:
      type: object
      description: Recipient appearances grouped by normalized street address, city, state, and ZIP5. Address fields may be omitted according to the caller's PII access level.
      required:
      - campaign_count
      - is_opted_out
      - campaigns
      properties:
        recipient_name:
          type: string
          nullable: true
        recipient_address:
          type: string
          nullable: true
        recipient_city:
          type: string
          nullable: true
        recipient_state:
          type: string
          nullable: true
        recipient_zip:
          type: string
          nullable: true
        campaign_count:
          type: integer
          minimum: 0
        is_opted_out:
          type: boolean
        campaigns:
          type: array
          items:
            $ref: '#/components/schemas/RecipientCampaignAppearance'
    RecipientSearchResponse:
      type: object
      required:
      - results
      - total
      - limit
      - offset
      - query
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/RecipientSearchResult'
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
        query:
          type: string
    RecipientOptOutResponse:
      type: object
      description: 'Response from `POST /v1/mail-tracking/recipients/opt-out` and `DELETE /v1/mail-tracking/recipients/opt-out`. Suppression is tenant-wide and address-level: the server matches by normalized address (case-insensitive `address`/`city`/`state` + first 5 digits of `zip`) across every campaign the tenant owns. `recipients[]` lists the distinct partner `contact_id`s at that address group and is computed regardless of `rows_affected`, so an idempotent repeat (0 rows) or the opt-in/undo direction still returns the full set.'
      required:
      - opted_out
      - recipient_address
      - recipient_city
      - recipient_state
      - recipient_zip
      properties:
        opted_out:
          type: boolean
          description: '`true` on the opt-out (POST) response; `false` on the opt-in/undo (DELETE) response.'
        rows_affected:
          type: integer
          description: Number of `piece_tracking` rows the tenant-scoped UPDATE actually toggled. `0` on idempotent repeats (already opted out on POST, already opted in on DELETE).
          default: 0
        recipient_address:
          type: string
        recipient_city:
          type: string
        recipient_state:
          type: string
        recipient_zip:
          type: string
          description: First 5 digits of the ZIP, matching the server-side normalization.
        recipients:
          type: array
          description: Distinct `(contact_id, contact_type)` pairs for the tenant-scoped address group. Includes only pieces that carry a partner `contact_id`; empty when no affected piece has one. Populated on both POST (opt-out) and DELETE (opt-in) responses, and computed regardless of `rows_affected`.
          default: []
          items:
            $ref: '#/components/schemas/RecipientContactRef'
          example:
          - contact_id: ps_contact_8821
            contact_type: PROPERTY
    RateLimitError:
      type: object
      description: Returned when request rate exceeds limit. Check Retry-After header.
      properties:
        error:
          type: object
          properties:
            type:
              type: string
              example: rate_limit_error
            code:
              type: string
              enum:
              - RATE_LIMITED
              - INGEST_RATE_LIMITED
            message:
              type: string
            trace_id:
              type: string
    PartnerOrderCreateRequest:
      properties:
        external_id:
          anyOf:
          - type: string
          - type: 'null'
          title: External Id
        product_id:
          type: string
          title: Product Id
          description: Product identifier (e.g. 4x6_printed)
        product_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Product Name
        design_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Design Name
          description: Catalog design name for thumbnail matching
        sender:
          anyOf:
          - $ref: '#/components/schemas/SenderInfo'
          - type: 'null'
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
        mail_date:
          anyOf:
          - type: string
          - type: 'null'
          title: Mail Date
        pieces:
          type: integer
          exclusiveMinimum: 0.0
          title: Pieces
          description: Number of pieces
        postage_type:
          anyOf:
          - type: string
            enum:
            - first_class
            - standard
            - presort
          - type: 'null'
          title: Postage Type
          description: Selected postage class. Case-insensitive and trimmed server-side. When omitted, legacy partner requests default to first_class. The resolved value is persisted on the order and used to freeze gated pricing.
        list_id:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: List Id
          description: Opaque grouping key — orders sharing the same list_id are stitched into one Ballpoint campaign. ≤128 chars.
        list_name:
          anyOf:
          - type: string
          - type: 'null'
          title: List Name
        campaign_instance_id:
          anyOf:
          - type: string
            pattern: ^[A-Za-z0-9_-]{1,64}$
          - type: 'null'
          title: Campaign Instance Id
          description: Optional submit/split instance key. When set and shared across orders in the same campaign, enables cross-order recipient dedup as a guard-rail (A/B split disjoint slices). NULL bypasses cross-order dedup. Partners (iframe) populate for A/B split sibling orders only; single-send, multi-send, and edit-leads paths leave it NULL.
        variant:
          anyOf:
          - type: string
            enum:
            - a
            - b
          - type: 'null'
          title: Variant
          description: A/B split variant identifier ('a' or 'b'). Required only for split sibling orders so the iframe can reconstruct split identity after a reload (paired with campaign_instance_id). Single-send, multi-send, and edit-leads paths leave this NULL. Case-insensitive and trimmed server-side ('A', ' a ' → 'a'); any other value (e.g. 'c') is rejected with 422. Persisted in the order's metadata JSONB as metadata.variant and round-tripped on GET /orders and GET /orders/{order_id}.
        external_account_id:
          anyOf:
          - type: string
          - type: 'null'
          title: External Account Id
        external_user_id:
          anyOf:
          - type: string
          - type: 'null'
          title: External User Id
        logo:
          anyOf:
          - type: string
          - type: 'null'
          title: Logo
        print_font:
          anyOf:
          - type: string
          - type: 'null'
          title: Print Font
        shipping_option:
          anyOf:
          - type: string
          - type: 'null'
          title: Shipping Option
        customer_info:
          anyOf:
          - $ref: '#/components/schemas/CustomerInfo'
          - type: 'null'
        postcard_size:
          anyOf:
          - type: string
          - type: 'null'
          title: Postcard Size
          description: 'Postcard size: 4x6 or 6x9'
        canvas_json:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Canvas Json
          description: Fabric.js canvas JSON. Two-sided products use {front, back}; color_letter accepts {front} because its V1 insert is one-sided and is limited to 500 pieces per order. Its 11 canonical #Token# dynamic fields resolve at render time from sender and recipient data. For color_letter V1, the complete JSON is limited to 20 MiB, depth 50, 10,000 JSON nodes, and 1,000 Fabric objects. Embedded image sources are limited to 14 MiB of base64 PNG/JPEG/WebP data. Remote image sources must use approved Ballpoint asset paths or the PropStream /direct-mail/ asset prefix; other hosts and tokenized image URLs are rejected. Existing two-sided product request validation is unchanged.
        template_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Template Id
          description: Template ID for canvas builder orders
        product_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Product Type
          description: Canonical Ballpoint product_type (e.g. '4x6_printed', '6x9_printed', '4x6_cursive', '6x9_cursive', 'color_letter', 'hybrid_letter', 'greeting_letter'). When present, validated against VALID_PRODUCT_TYPES and used as canonical. When absent, the server derives type from product_id/product_name (transitional internal fallback — do not rely on).
        external_user_metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: External User Metadata
          description: Opaque per-end-user attribution dict — echoed verbatim on outbound webhooks. Max 8 keys, keys 64 chars, values 256 chars, no nested objects/arrays, ≤2KB total. Captured at creation only (not mutable via PATCH).
        deliver_to:
          anyOf:
          - type: string
            enum:
            - mailing
            - property
            - both
          - type: 'null'
          title: Deliver To
          description: Optional, additive. Recipient address routing the user selected on the iframe's piece-selection page when a `piece_counts` table was active. One of `mailing`, `property`, `both`. Case-insensitive and trimmed server-side (`"MAILING"`, `" both "` → `"mailing"`, `"both"`); any other value is rejected with 422. Sent only when a validated recipient selection exists; single-send/multi-send/edit-leads paths without `piece_counts` leave it `null`. Persisted to the order's metadata JSONB as `metadata.deliver_to` and round-tripped on GET /orders and GET /orders/{order_id}. Iframe-driven persistence — no PropStream action required.
        remove_duplicate_addresses:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Remove Duplicate Addresses
          description: Optional, additive. Whether the user enabled the "Remove duplicates" checkbox on the iframe's piece-selection page (paired with `deliver_to`). Persisted to the order's metadata JSONB as `metadata.remove_duplicate_addresses` (round-tripped on GET /orders and GET /orders/{order_id}) even when `false`, so partners can read back the user's exact selection. `null`/absent when no recipient-selection UI was shown. Iframe-driven persistence — no PropStream action required.
      type: object
      required:
      - product_id
      - pieces
      title: PartnerOrderCreateRequest
    SenderInfo:
      properties:
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        company:
          anyOf:
          - type: string
          - type: 'null'
          title: Company
        address:
          anyOf:
          - type: string
          - type: 'null'
          title: Address
        city:
          anyOf:
          - type: string
          - type: 'null'
          title: City
        state:
          anyOf:
          - type: string
          - type: 'null'
          title: State
        zip:
          anyOf:
          - type: string
            maxLength: 10
            pattern: '^(?:[0-9]{5}|[0-9]{9}|[0-9]{5}-[0-9]{4})?$'
          - type: 'null'
          title: Zip
          description: Sender ZIP. Accepts 5 digits, 9 digits, ZIP+4, empty, or null. Invalid non-empty values return 422.
        phone:
          anyOf:
          - type: string
            maxLength: 20
            pattern: '^(?:(?:\+?1(?:[ .]|-)?)?(?:\([0-9]{3}\)|[0-9]{3})(?:[ .]|-)?[0-9]{3}(?:[ .]|-)?[0-9]{4})?$'
          - type: 'null'
          title: Phone
          description: Sender phone with 10 digits, or 11 digits beginning with 1. Standard formatting characters are accepted; empty/null remains optional. Invalid non-empty values return 422.
        website:
          anyOf:
          - type: string
          - type: 'null'
          title: Website
      type: object
      title: SenderInfo
    CustomerInfo:
      properties:
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        website:
          anyOf:
          - type: string
          - type: 'null'
          title: Website
        rma:
          anyOf:
          - type: string
          - type: 'null'
          title: Rma
        phone:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone
        shipping_address:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Shipping Address
          description: 'Shipping address: {address, city, state, zip}'
      type: object
      title: CustomerInfo
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
security:
- bearerAuth: []
- partnerKeyAuth: []
paths:
  /v1/billing/pricing:
    get:
      tags:
      - Orders
      summary: Get pricing catalog
      description: "Returns the pricing catalog for all product/postage combinations available to the calling principal. Partner principals with a configured markup see the marked-up (retail) `unit_price_tcents`; internal/live/test principals see base prices. Rate-limited per principal (read tier).\n\nEach row exposes `sla_business_days`, the production lead time (business days) between the scheduled production start and `mail_date` for that product type. Current policy: printed postcards = 3, cursive/written postcards = 4, all letters = 6. This value is a UX affordance so partners can render an accurate date-picker minimum. It is not currently enforced server-side at order creation — server-side enforcement is planned separately."
      operationId: listPricing
      parameters:
      - name: product_type
        in: query
        required: false
        description: Optional filter — return rows for a single product type only.
        schema:
          type: string
      responses:
        '200':
          description: Pricing catalog rows
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PricingRow'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/billing/orders/{order_id}:
    get:
      tags:
      - Orders
      summary: Get order
      description: 'Retrieve a single order by `order_id`. Tenant-scoped: partners only see their own orders; live/test accounts only see orders on their own `account_id`. Cross-tenant or missing `order_id` both return `404` (never `403`) so order existence cannot be probed across tenants. Response shape matches each element of `GET /v1/billing/orders`.'
      operationId: getOrder
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Order details
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Order not found (also returned for cross-tenant lookups)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /orders/{order_id}/cancel:
    post:
      tags:
      - Orders
      summary: Cancel order (partner contract)
      description: Cancels a partner-owned order before production prep. The lookup is scoped by the exact account_id, source, and external_account_id identity. A successful transition emits both order.status_changed and the dedicated order.drop_cancelled event. The operation is state-changing and intentionally has no request body.
      operationId: partnerCancelOrder
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Order cancelled
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - id
                - status
                properties:
                  id:
                    type: string
                  status:
                    const: cancelled
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Order not found, including cross-tenant lookups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Order is already terminal or production prep has begun
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/billing/orders/{order_id}/reschedule:
    post:
      tags:
      - Orders
      summary: Reschedule order (same-order)
      description: Update an order's scheduled mail date without creating a replacement order. Allowed while `production_status='scheduled'` — paid or unpaid (v1.7.32 / PROPS-3322; the lock is entering production, not payment; `PAID_LOCKED` retired). Rescheduling a paid order is date-only — no re-billing, no repricing. The same `order_id` is preserved; the backend recomputes `scheduled_production_date` from the product SLA (in business days, Mon–Fri; see `API_KIT.md §6q` for per-product table). Idempotent on no-op (when the supplied `mail_date` equals the order's current value, the call returns 200 with no webhook/audit side-effects). See `API_KIT.md §6m` for the full contract and `order.rescheduled` webhook event payload.
      operationId: rescheduleOrder
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - mail_date
              properties:
                mail_date:
                  type: string
                  format: date
                  description: New mail date, `YYYY-MM-DD`. Interpreted at UTC midnight.
                  example: '2026-08-15'
      responses:
        '200':
          description: Order rescheduled. If `previous_mail_date == new_mail_date` this is an idempotent no-op (no webhook fired, no audit row written).
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                type: object
                required:
                - order_id
                - new_mail_date
                - new_scheduled_production_date
                properties:
                  order_id:
                    type: string
                  previous_mail_date:
                    type: string
                    format: date
                    nullable: true
                  new_mail_date:
                    type: string
                    format: date
                  previous_scheduled_production_date:
                    type: string
                    format: date-time
                    nullable: true
                  new_scheduled_production_date:
                    type: string
                    format: date-time
        '400':
          description: 'Validation failure. `error.code` values: `MAIL_DATE_INVALID_FORMAT` (not `YYYY-MM-DD`), `MAIL_DATE_TOO_SOON` (`mail_date − SLA_days` is ≤ today + 1 day), `MAIL_DATE_TOO_FAR` (> 365 days in the future).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Order not found (also returned for cross-tenant lookups so order existence cannot be probed across tenants).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'Order is not in a reschedulable state. `error.code` values: `SEND_NOW_PROCESSING` (`pending_payment` awaiting `/confirm-payment`), `IN_PRODUCTION` (status is accepted/prep/printing/writing/inserting/stamping/ shipping), `TERMINAL` (status is complete/cancelled/failed/ payment_failed), `STATE_CHANGED` (concurrent state transition between read and write; retry once).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/billing/campaigns/{campaign_id}/recipients:
    patch:
      tags:
      - Recipients
      summary: Campaign-level delta recipient add/remove across editable drops
      operationId: campaignDeltaRecipients
      description: 'Add/remove recipients across all editable drops in a campaign with one call. Delta-based: `added[]` upserts by `contact_id + address_type`, `removed[]` deletes by key, `remove_all` clears and replaces. Editable drops: status ∈ {scheduled, pending_payment} with payment_confirmed=false. Locked drops (accepted, in production, mailed, delivered, terminal) are skipped and reported in the response. Gated accounts only (requires_payment_confirmation=TRUE). See API_KIT.md §6p.'
      parameters:
      - name: campaign_id
        in: path
        required: true
        schema:
          type: string
        description: Ballpoint campaign ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                added:
                  type: array
                  maxItems: 10000
                  description: Recipients to add/upsert on each editable drop.
                  items:
                    type: object
                    required:
                    - contact_id
                    - address_type
                    - address
                    - city
                    - state
                    - zip
                    properties:
                      contact_id:
                        type: string
                        maxLength: 64
                        description: Partner-side unique recipient identifier.
                      address_type:
                        type: string
                        enum:
                        - PROPERTY
                        - MAILING
                        description: Combined with contact_id, forms the unique key.
                      first_name:
                        type: string
                        nullable: true
                        description: At least one of first_name or last_name required.
                      last_name:
                        type: string
                        nullable: true
                        description: At least one of first_name or last_name required.
                      company:
                        type: string
                        nullable: true
                      address:
                        type: string
                        description: Street address line 1.
                      address2:
                        type: string
                        nullable: true
                      city:
                        type: string
                      state:
                        type: string
                        minLength: 2
                        maxLength: 2
                        description: 2-letter state code (uppercase).
                      zip:
                        type: string
                        description: 5 or 5+4 digit ZIP code.
                removed:
                  type: array
                  maxItems: 10000
                  description: Recipients to remove from each editable drop by unique key.
                  items:
                    type: object
                    required:
                    - contact_id
                    - address_type
                    properties:
                      contact_id:
                        type: string
                        maxLength: 64
                      address_type:
                        type: string
                        enum:
                        - PROPERTY
                        - MAILING
                remove_all:
                  type: boolean
                  default: false
                  description: If true, clears all recipients from editable drops before applying added[]. Cannot be combined with removed[] (422).
      responses:
        '200':
          description: Delta applied to all editable drops.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                type: object
                required:
                - campaign_id
                - added_count
                - removed_count
                - removed_not_found_count
                - drops_affected
                - drops_locked
                properties:
                  campaign_id:
                    type: string
                    description: The campaign that was modified.
                  added_count:
                    type: integer
                    description: Number of recipient keys in the added[] request (includes upserts).
                  removed_count:
                    type: integer
                    description: Keys from removed[] that matched at least one recipient across editable drops.
                  removed_not_found_count:
                    type: integer
                    description: Keys from removed[] that matched zero recipients. removed_count + removed_not_found_count = len(removed[]).
                  drops_affected:
                    type: array
                    description: Drops that were successfully mutated.
                    items:
                      type: object
                      required:
                      - order_id
                      - previous_piece_count
                      - new_piece_count
                      - new_total_price_tcents
                      - payment_confirmed
                      properties:
                        order_id:
                          type: string
                        previous_piece_count:
                          type: integer
                        new_piece_count:
                          type: integer
                          description: Per-drop source of truth for recipient count after mutation.
                        previous_total_price_tcents:
                          type: integer
                          nullable: true
                          description: Populated for gated orders created on/after 2026-06-23 (price frozen at creation, no debit); null only for legacy gated orders created before that change.
                        new_total_price_tcents:
                          type: integer
                          description: Always computed via current pricing tables. Non-null.
                        payment_confirmed:
                          type: boolean
                          description: Always false (editable drops are by definition unconfirmed).
                  drops_locked:
                    type: array
                    description: Drops skipped because they are past the editable window.
                    items:
                      type: object
                      required:
                      - order_id
                      - locked_reason
                      - current_status
                      properties:
                        order_id:
                          type: string
                        locked_reason:
                          type: string
                          enum:
                          - paid_or_accepted
                          - in_production
                          - mailed
                          - delivered
                          - terminal
                          description: paid_or_accepted = payment_confirmed=true OR status=accepted. in_production = prep/printing/writing/inserting/stamping/shipping. mailed = complete. delivered = shipped/in_transit/out_for_delivery/delivered. terminal = cancelled/failed/payment_failed.
                        current_status:
                          type: string
                          description: The drop's current production status.
        '400':
          description: No pricing found for product/postage at the new piece count. error.code = NO_PRICING.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Campaign not found (also returned for cross-tenant lookups). error.code = CAMPAIGN_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'error.code values: PAYMENT_GATE_NOT_ACTIVE (account not gated), NO_EDITABLE_DROPS (all orders in campaign are locked).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation failure. Empty request, remove_all+removed[] conflict, duplicate keys in added[]/removed[], invalid recipient fields, or invalid address_type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/billing/campaigns/preview:
    post:
      tags:
      - Campaigns
      summary: Campaign-level cost preview (server-to-server)
      description: 'Server-to-server cost preview for a set of already-persisted orders that share the same campaign. Call only after recipient upload has completed for every selected order and each selected upload reports `ready=true` with `piece_count>0`; A/B variants require address-disjoint recipient slices. Prices exactly the caller-selected set of order IDs (any subset of one campaign); the endpoint does NOT compute billing windows or decide which drops are due. After preview, call `/confirm-payment` only for response rows where `excluded_from_totals=false`; rows marked excluded are not part of the quoted campaign amount. Reads the persisted order inputs (no recomputation from raw inputs) and returns per-order pricing in raw tenth-cents plus the exact whole-cent `/confirm-payment` ledger result (`partner_debit_cents` per order, `campaign_partner_debit_cents` campaign-wide). For stripe/manual billing, each order settles independently and a fractional cent rounds up, never down; for `billing_mode=none`, the result is zero because no charge or usage is recorded. `partner_cost_total_tcents` is the raw wholesale amount; `campaign_partner_debit_cents` is the exact ledger result; `total_tcents` is display/retail and MUST NOT be used for debit. Replaces the prior per-order N-call preview pattern with a single call. Orders that are not chargeable right now (already confirmed, cancelled, failed, payment_failed, or otherwise not in a chargeable state) are still returned in `orders[]` with `excluded_from_totals=true` and an `exclusion_reason`, but are NOT added to `campaign_partner_cost_total_tcents`. Partner-only (non-partner principals receive `401`). Gated accounts only (`requires_payment_confirmation=TRUE`).'
      operationId: previewCampaignCost
      security:
      - partnerKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - order_ids
              - expected_order_count
              properties:
                order_ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  description: Persisted order IDs to preview. All orders MUST belong to the same campaign (mixed `campaign_id` values are rejected with `400 MIXED_CAMPAIGN_IDS`). Duplicates are rejected with `422 ORDER_IDS_DUPLICATE`.
                  items:
                    type: string
                expected_order_count:
                  type: integer
                  description: Expected length of `order_ids`. Used as a guard-rail against partial/truncated client payloads; mismatch with `len(order_ids)` returns `400 ORDER_COUNT_MISMATCH`.
      responses:
        '200':
          description: 'Per-order preview plus campaign-level wholesale totals. Use `campaign_partner_debit_cents` for the exact whole-cent ledger debit; the `*_tcents` fields carry the raw tenth-cent wholesale math for reconciliation.'
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                type: object
                required:
                - campaign_id
                - currency
                - order_ids
                - orders
                - campaign_partner_cost_total_tcents
                - campaign_partner_debit_cents
                properties:
                  campaign_id:
                    type: string
                    description: The single campaign all `order_ids` belong to.
                  currency:
                    type: string
                    enum:
                    - USD
                  order_ids:
                    type: array
                    description: Echo of the requested `order_ids` (same order).
                    items:
                      type: string
                  orders:
                    type: array
                    description: Per-order preview rows. Includes both chargeable-now and excluded orders; only chargeable-now rows are summed into `campaign_partner_cost_total_tcents`.
                    items:
                      type: object
                      required:
                      - order_id
                      - production_status
                      - payment_confirmed
                      - product_type
                      - postage_type
                      - piece_count
                      - unit_price_tcents
                      - total_tcents
                      - partner_cost_unit_price_tcents
                      - partner_cost_total_tcents
                      - partner_debit_cents
                      - price_source
                      - excluded_from_totals
                      - exclusion_reason
                      properties:
                        order_id:
                          type: string
                        production_status:
                          type: string
                        payment_confirmed:
                          type: boolean
                        product_type:
                          type: string
                        postage_type:
                          type: string
                        piece_count:
                          type: integer
                          minimum: 1
                        unit_price_tcents:
                          type: integer
                          description: Display/retail unit price in tenths of a cent. NOT the partner debit amount.
                        total_tcents:
                          type: integer
                          description: Display/retail total in tenths of a cent. NOT the partner debit amount.
                        partner_cost_unit_price_tcents:
                          type: integer
                          description: Wholesale partner-cost unit price in tenths of a cent.
                        partner_cost_total_tcents:
                          type: integer
                          description: Raw wholesale partner-cost total for this order in tenths of a cent (`partner_cost_unit_price_tcents * piece_count`; may carry a fractional cent). Sum of these across chargeable-now orders equals `campaign_partner_cost_total_tcents`. NOT the exact ledger debit — see `partner_debit_cents`.
                        partner_debit_cents:
                          type: integer
                          nullable: true
                          description: 'Exact whole-cent ledger amount recorded when `/confirm-payment` succeeds. For stripe/manual billing: `ceil(partner_cost_total_tcents / 100)` — a fractional cent rounds up, never down (522636 tcents -> 5227 cents). Returns `0` for `billing_mode=none`, which records no charge or usage, and `null` when `excluded_from_totals=true`. Equals the eventual amount provided the pricing tier, billing mode, and persisted product/postage/piece-count inputs do not change between preview and confirm; re-preview after any order/recipient edit. This is an amount quote, not authorization; confirmation can still fail account, balance, piece-cap, or spending-limit checks.'
                        price_source:
                          type: string
                          enum:
                          - frozen
                          - computed_from_persisted_order_inputs
                          description: 'Always `computed_from_persisted_order_inputs` for this endpoint as of PROPS-3087: pricing is recomputed live from the persisted product/postage/piece_count inputs using the current pricing tables (no raw client inputs accepted), so the preview equals the `/confirm-payment` charge. `frozen` (a persisted price snapshot reused as-is) is retained in the enum for backward compatibility but is no longer emitted by this endpoint.'
                        excluded_from_totals:
                          type: boolean
                          description: '`true` when the order is not chargeable right now and its `partner_cost_total_tcents` is NOT included in `campaign_partner_cost_total_tcents`.'
                        exclusion_reason:
                          type: string
                          nullable: true
                          description: 'Why the order was excluded from totals. `null` for chargeable-now orders. Values: `already_confirmed` (payment_confirmed=true), `cancelled`, `failed`, `payment_failed`, `not_chargeable_status` (any other status not in the chargeable set).'
                  campaign_partner_cost_total_tcents:
                    type: integer
                    description: Raw wholesale total for this preview, in tenths of a cent. Sums `partner_cost_total_tcents` across orders with `excluded_from_totals=false` only. May carry fractional cents; NOT the exact ledger amount — use `campaign_partner_debit_cents`.
                  campaign_partner_debit_cents:
                    type: integer
                    description: 'Exact total whole-cent ledger amount recorded when `/confirm-payment` succeeds for the chargeable-now orders in this response, provided the pricing tier, billing mode, and persisted product/postage/piece-count inputs do not change between preview and confirm. Sum of per-order `partner_debit_cents`. For stripe/manual billing each order settles independently — sum of per-order ceilings, NOT one ceiling of the summed raw tcents: two orders of 5001 tcents debit 51+51=102 cents, not 101. Returns `0` for `billing_mode=none`. Re-preview after any order/recipient edit. This is an amount quote, not a guarantee that confirmation-time account, balance, piece-cap, or spending-limit checks will pass.'
        '400':
          description: 'Validation failure. `error.code` values: `ORDER_COUNT_MISMATCH` (`expected_order_count` != `len(order_ids)`), `MIXED_CAMPAIGN_IDS` (orders span more than one campaign).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized. Endpoint requires `X-Partner-Key`; bearer/JWT principals receive `401`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'One or more `order_ids` could not be found (also returned for cross-tenant lookups so order existence cannot be probed across tenants). `error.code` = `ORDER_NOT_FOUND`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'Persisted state conflict. `error.code` values: `PAYMENT_GATE_NOT_ACTIVE` (account requires `requires_payment_confirmation=TRUE`), `INVALID_PIECE_COUNT` (at least one order has `piece_count<=0` and cannot be priced or confirmed).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 'Validation failure on `order_ids`. `error.code` values: `ORDER_IDS_EMPTY` (empty array), `ORDER_IDS_DUPLICATE` (duplicate IDs in the array), `ORDER_IDS_LIMIT_EXCEEDED` (more than 100 IDs).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/mail-tracking/recipients/search:
    get:
      tags:
      - Mail Tracking
      summary: Search recipients across direct-mail campaigns
      description: Searches both accepted/uploaded order recipients and indexed piece-tracking rows. Query tokens are punctuation-tolerant and may match in any order. Results are grouped by normalized address; tracking data wins when an order and tracking row represent the same campaign/address. Repeat `list_id` to restrict the search to the same campaign-list scope as the embedded dashboard; omit it for authorized account-wide search. The embedded iframe calls this endpoint automatically.
      operationId: searchRecipients
      parameters:
      - name: q
        in: query
        required: true
        description: Recipient name or mailing-address query. All tokens must match in any order.
        schema:
          type: string
          minLength: 2
          maxLength: 200
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: list_id
        in: query
        required: false
        description: Campaign list scope. Repeat for multiple lists (maximum 100). Omit for authorized account-wide search. Present-but-empty resolves to zero results and never widens scope.
        schema:
          type: array
          maxItems: 100
          items:
            type: string
        style: form
        explode: true
      - name: X-External-User-ID
        in: header
        required: false
        description: When present on a partner request, limits results to campaigns attributed to this external user. Omit for an authorized tenant-wide search.
        schema:
          type: string
      responses:
        '200':
          description: Paginated recipient/address matches. Order-only campaign appearances have null `last_scan_at` and `piece_status` until tracking exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipientSearchResponse'
        '401':
          description: Missing or invalid authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The principal has no recipient PII access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Query or pagination validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
          headers:
            Retry-After:
              $ref: '#/components/headers/Retry-After'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
