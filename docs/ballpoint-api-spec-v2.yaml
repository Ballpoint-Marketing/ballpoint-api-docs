      operationId: get_partner_config
      description: |
        Returns boolean-only partner feature flags for the current source/user
        context. The iframe caches this response in memory for 60 seconds.
        For PropStream, `propstream_send_mail_enabled` also gates both order
        creation routes authoritatively; disabled requests return
        `403 FEATURE_DISABLED` before any mutation.
      security:
