        schema:
          type: string
          maxLength: 100
      responses:
        '200':
          description: Resolved feature configuration
          headers:
            Cache-Control:
              description: Private in-memory cache TTL.
              schema:
                type: string
                const: private, max-age=60
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerConfigResponse'
        '400':
          description: Invalid external user ID
          content:
