openapi: 3.1.0
info:
  title: Ballpoint Marketing API (v1, staging)
  version: 3.1.0
  description: "This spec documents the v1 API as deployed on staging. Production and v2 are out of scope.\n\nDirect mail automation API for programmatic postcard, letter, and campaign delivery.\n\n## Authentication\n\nTwo authentication methods are supported:\n\n### Bearer JWT (live/test principals)\n```bash\ncurl https://staging-api.ballpointmarketing.com/orders \\\n  -H \"Authorization: Bearer eyJhbG...\"\n```\n\n### Partner Key (platform integrations)\n```bash\ncurl https://staging-api.ballpointmarketing.com/orders \\\n  -H \"X-Partner-Key: pk_test_PARTNER_REPLACE_ME\"\n```\n\n## Principal Types\n\n| Type | Auth Method | Permissions |\n|------|-------------|-------------|\n| `live` | Bearer JWT | Full access to own account |\n| `test` | Bearer JWT | Sandbox only, no real mail |\n| `partner` | X-Partner-Key | Scoped to source + external_account_id |\n\n## Integration Identity\n\nPartner integrations use identity fields to scope resources:\n\n- `source`: Integration identifier assigned during onboarding\n- `external_account_id`: Partner's tenant/customer ID\n- `external_user_id`: Partner's user ID within tenant\n- `external_id`: Partner's ID for the resource\n\n## Error Handling\n\nAll errors return a consistent envelope with trace ID for debugging:\n\n```json\n{\n  \"error\": {\n    \"type\": \"validation_error\",\n    \"code\": \"INVALID_ADDRESS\",\n    \"message\": \"Address could not be verified\",\n    \"details\": { \"field\": \"to_address_line1\" },\n    \"trace_id\": \"tr_abc123\"\n  }\n}\n```\n\n## Idempotency\n\n`Idempotency-Key` header is REQUIRED for `POST /orders` (returns 400 if missing):\n\n- Keys are scoped to principal + key; endpoint is enforced via request hash (method + path + body)\n- TTL: 24 hours\n- Matching key + different body = `422 Unprocessable Entity`\n- Matching key + same body = cached response replayed\n\n## Versioning\n\n- REST API: URL versioning (`/v1/...`)\n- Webhooks: `X-Webhook-Version` header + `version` field in payload\n- API follows semantic versioning (MAJOR.MINOR.PATCH)\n\n    \n    ## Mail Tracking (v2.0)\n    \n    USPS IV-MTR scan data integration for piece-level mail tracking.\n    Upload Accuzip manifests, receive scan events via SFTP, and query\n    campaign-level and piece-level delivery status.\n    \n    See endpoints tagged `Mail Tracking` below.\n\n    \n    ## CORS\n    \n    API supports CORS for browser-based dashboard access. Allowed origins\n    configured via `CORS_ALLOWED_ORIGINS` environment variable.\n    \n    Exposed response headers: `X-Trace-Id`, `X-Request-Id`\n    \n    ## Rate Limiting\n    \n    All endpoints are rate-limited per principal (auth key) with IP fallback.\n    Read endpoints: 60 req/min. Ingest endpoints: 10 req/min.\n    Per-account limits (RPM, RPD, daily piece cap) are also enforced.\n    \n    Rate limit headers on all responses:\n    - `X-RateLimit-Remaining`: requests remaining in window\n    - `Retry-After`: seconds until reset (on 429 only)\n    \n    ## Webhook Security\n    \n    Webhook payloads are signed with HMAC-SHA256. Verify using:\n    - `X-Ballpoint-Signature`: `sha256=<hex>` — HMAC of `timestamp + body`\n    - `X-Ballpoint-Timestamp`: ISO 8601 timestamp (reject if > 5 minutes old)\n    - `X-Ballpoint-Event-Id`: unique ID for deduplication\n    - `X-Ballpoint-Delivery`: unique delivery attempt ID\n    \n    Secret rotation: set `WEBHOOK_SECRET_NEXT` during rotation. Both secrets\n    are tried during verification for overlap window.\n"
  contact:
    name: Ballpoint API Support
    email: api-support@ballpointmarketing.com
  license:
    name: Proprietary
servers:
- url: https://staging-api.ballpointmarketing.com
  description: Staging
tags:
- name: Orders
  description: Single-piece mail orders
- name: Campaigns
  description: Bulk mail campaigns with recipient lists
- name: Addresses
  description: Address verification
- name: Webhooks
  description: Event notifications
- name: Reconciliation
  description: Partner debugging and support
- name: Sandbox
  description: Testing and integration validation
- name: Mail Tracking
  description: USPS mail tracking — campaign summary, piece-level status, scan events, RTS suppression
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT token for live/test principals. Obtain from the Ballpoint dashboard.

        ```

        Authorization: Bearer eyJhbG...

        ```

        '
    partnerKeyAuth:
      type: apiKey
      in: header
      name: X-Partner-Key
      description: 'Partner integration key.

        Scoped to source + external_account_id.

        ```

        X-Partner-Key: pk_test_PARTNER_REPLACE_ME

        ```

        '
  headers:
    X-Trace-Id:
      description: Unique trace ID for debugging
      schema:
        type: string
    Idempotency-Key:
      description: Idempotency key for request deduplication
      schema:
        type: string
        maxLength: 64
    RateLimit-Limit:
      description: Request limit per window
      schema:
        type: integer
    RateLimit-Remaining:
      description: Remaining requests in window
      schema:
        type: integer
    RateLimit-Reset:
      description: Window reset time (Unix timestamp)
      schema:
        type: integer
    X-RateLimit-Remaining:
      description: Number of requests remaining in current window
      schema:
        type: integer
    Retry-After:
      description: Seconds until rate limit resets (present on 429 responses)
      schema:
        type: integer
    X-Ballpoint-Signature:
      description: 'HMAC-SHA256 signature: sha256=<hex>. Verify with webhook secret.'
      schema:
        type: string
        example: sha256=a1b2c3d4...
    X-Ballpoint-Event:
      description: Webhook event type (e.g., tracking.status_changed)
      schema:
        type: string
    X-Ballpoint-Event-Id:
      description: Unique event ID for deduplication
      schema:
        type: string
        format: uuid
    X-Ballpoint-Delivery:
      description: Unique delivery attempt ID
      schema:
        type: string
        format: uuid
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - type
          - code
          - message
          properties:
            type:
              type: string
              enum:
              - validation_error
              - authentication_error
              - authorization_error
              - not_found
              - conflict
              - rate_limit_error
              - server_error
            code:
              type: string
              description: Machine-readable error code
              enum:
              - INVALID_ADDRESS
              - ADDRESS_UNDELIVERABLE
              - INVALID_PDF
              - INVALID_STATUS_TRANSITION
              - AMBIGUOUS_LOOKUP
              - IDEMPOTENCY_CONFLICT
              - INSUFFICIENT_BALANCE
              - RATE_LIMITED
              - NOT_FOUND
              - UNAUTHORIZED
              - FORBIDDEN
            message:
              type: string
              description: Human-readable error message
            details:
              type: object
              description: Additional error context
            trace_id:
              type: string
              description: Request trace ID for support
    OrderDetail:
      type: object
      description: 'Response shape for `GET /v1/billing/orders/{order_id}` and each element of `GET /v1/billing/orders`. Source of truth: `_format_order_row` (billing_router.py). Status fields are documented as plain strings because the live enum sets are owned by the API and can evolve; partners should treat them as opaque values.'
      properties:
        id:
          type: string
          pattern: ^ord_[a-zA-Z0-9]+$
        campaign_id:
          type: string
        account_id:
          type: string
        source:
          type: string
          nullable: true
        external_account_id:
          type: string
          nullable: true
        external_user_id:
          type: string
          nullable: true
        product_type:
          type: string
        postage_type:
          type: string
        piece_count:
          type: integer
        unit_price_tcents:
          type: integer
          description: Unit price in tenths of a cent.
        total_price_tcents:
          type: integer
          description: Total price in tenths of a cent.
        production_status:
          type: string
        usps_status:
          type: string
          nullable: true
        display_status:
          type: string
          description: Aggregated status surfaced to the partner.
        envelope_style:
          type: string
          nullable: true
        print_font:
          type: string
          nullable: true
        shipping_option:
          type: string
          nullable: true
        proof_approval_status:
          type: string
          nullable: true
        metadata:
          type: string
          nullable: true
          description: JSON-encoded metadata object string; parse as JSON if you need nested metadata. Matches GET /v1/billing/orders list behavior. May include `variant` (`"a"`/`"b"`, A/B split sibling orders only — see `PartnerOrderCreateRequest.variant`), `deliver_to` (`"mailing"`/`"property"`/`"both"`, recipient routing selection from POST /orders), and `remove_duplicate_addresses` (boolean, recipient dedupe selection from POST /orders). All three are optional and additive — absent when the corresponding POST field was not supplied.
        customer_info:
          type: object
          nullable: true
          description: Nested customer info. `null` when no `customer_*` columns are populated; otherwise an object with the populated subset of the five fields below (absent keys mean "not set").
          properties:
            name:
              type: string
              nullable: true
            website:
              type: string
              nullable: true
            rma:
              type: string
              nullable: true
            phone:
              type: string
              nullable: true
            shipping_address:
              type: string
              nullable: true
        sla_due_at:
          type: string
          format: date-time
          nullable: true
        priority:
          type: string
          nullable: true
        render_status:
          type: string
          nullable: true
        status_changed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    MailTrackingSummary:
      type: object
      description: Campaign-level mail tracking summary. Safe for all principal types — no PII.
      properties:
        campaign_id:
          type: string
        mail_status:
          type: string
          enum:
          - shipped
          - in_transit
          - out_for_delivery
          - delivered
        mail_status_label:
          type: string
        total_pieces:
          type: integer
        scanned_pieces:
          type: integer
        delivered:
          type: integer
        in_transit:
          type: integer
        out_for_delivery:
          type: integer
        rts:
          type: integer
        forwarded:
          type: integer
        delivered_rate:
          type: number
          format: float
        scan_coverage:
          type: number
          format: float
        rts_rate:
          type: number
          format: float
        first_scan_at:
          type: string
          format: date-time
          nullable: true
        last_scan_at:
          type: string
          format: date-time
          nullable: true
        last_delivered_at:
          type: string
          format: date-time
          nullable: true
        last_updated_at:
          type: string
          format: date-time
          nullable: true
        status_version:
          type: string
    RateLimitError:
      type: object
      description: Returned when request rate exceeds limit. Check Retry-After header.
      properties:
        error:
          type: object
          properties:
            type:
              type: string
              example: rate_limit_error
            code:
              type: string
              enum:
              - RATE_LIMITED
              - INGEST_RATE_LIMITED
            message:
              type: string
            trace_id:
              type: string
    PartnerOrderCreateRequest:
      properties:
        external_id:
          anyOf:
          - type: string
          - type: 'null'
          title: External Id
        product_id:
          type: string
          title: Product Id
          description: Product identifier (e.g. 4x6_printed)
        product_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Product Name
        design_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Design Name
          description: Catalog design name for thumbnail matching
        sender:
          anyOf:
          - $ref: '#/components/schemas/SenderInfo'
          - type: 'null'
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
        mail_date:
          anyOf:
          - type: string
          - type: 'null'
          title: Mail Date
        pieces:
          type: integer
          exclusiveMinimum: 0.0
          title: Pieces
          description: Number of pieces
        list_id:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: List Id
          description: Opaque grouping key — orders sharing the same list_id are stitched into one Ballpoint campaign. ≤128 chars.
        list_name:
          anyOf:
          - type: string
          - type: 'null'
          title: List Name
        campaign_instance_id:
          anyOf:
          - type: string
            pattern: ^[A-Za-z0-9_-]{1,64}$
          - type: 'null'
          title: Campaign Instance Id
          description: Optional submit/split instance key. When set and shared across orders in the same campaign, enables cross-order recipient dedup as a guard-rail (A/B split disjoint slices). NULL bypasses cross-order dedup. Partners (iframe) populate for A/B split sibling orders only; single-send, multi-send, and edit-leads paths leave it NULL.
        variant:
          anyOf:
          - type: string
            enum:
            - a
            - b
          - type: 'null'
          title: Variant
          description: A/B split variant identifier ('a' or 'b'). Required only for split sibling orders so the iframe can reconstruct split identity after a reload (paired with campaign_instance_id). Single-send, multi-send, and edit-leads paths leave this NULL. Case-insensitive and trimmed server-side ('A', ' a ' → 'a'); any other value (e.g. 'c') is rejected with 422. Persisted in the order's metadata JSONB as metadata.variant and round-tripped on GET /orders and GET /orders/{order_id}.
        external_account_id:
          anyOf:
          - type: string
          - type: 'null'
          title: External Account Id
        external_user_id:
          anyOf:
          - type: string
          - type: 'null'
          title: External User Id
        logo:
          anyOf:
          - type: string
          - type: 'null'
          title: Logo
        print_font:
          anyOf:
          - type: string
          - type: 'null'
          title: Print Font
        shipping_option:
          anyOf:
          - type: string
          - type: 'null'
          title: Shipping Option
        customer_info:
          anyOf:
          - $ref: '#/components/schemas/CustomerInfo'
          - type: 'null'
        postcard_size:
          anyOf:
          - type: string
          - type: 'null'
          title: Postcard Size
          description: 'Postcard size: 4x6 or 6x9'
        canvas_json:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Canvas Json
          description: Fabric.js canvas JSON {front, back}
        template_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Template Id
          description: Template ID for canvas builder orders
        product_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Product Type
          description: Canonical Ballpoint product_type (e.g. '4x6_printed', '6x9_printed', '4x6_cursive', '6x9_cursive', 'color_letter', 'hybrid_letter', 'greeting_letter'). When present, validated against VALID_PRODUCT_TYPES and used as canonical. When absent, the server derives type from product_id/product_name (transitional internal fallback — do not rely on).
        external_user_metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: External User Metadata
          description: Opaque per-end-user attribution dict — echoed verbatim on outbound webhooks. Max 8 keys, keys 64 chars, values 256 chars, no nested objects/arrays, ≤2KB total. Captured at creation only (not mutable via PATCH).
        deliver_to:
          anyOf:
          - type: string
            enum:
            - mailing
            - property
            - both
          - type: 'null'
          title: Deliver To
          description: Optional, additive. Recipient address routing the user selected on the iframe's piece-selection page when a `piece_counts` table was active. One of `mailing`, `property`, `both`. Case-insensitive and trimmed server-side (`"MAILING"`, `" both "` → `"mailing"`, `"both"`); any other value is rejected with 422. Sent only when a validated recipient selection exists; single-send/multi-send/edit-leads paths without `piece_counts` leave it `null`. Persisted to the order's metadata JSONB as `metadata.deliver_to` and round-tripped on GET /orders and GET /orders/{order_id}. Iframe-driven persistence — no PropStream action required.
        remove_duplicate_addresses:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Remove Duplicate Addresses
          description: Optional, additive. Whether the user enabled the "Remove duplicates" checkbox on the iframe's piece-selection page (paired with `deliver_to`). Persisted to the order's metadata JSONB as `metadata.remove_duplicate_addresses` (round-tripped on GET /orders and GET /orders/{order_id}) even when `false`, so partners can read back the user's exact selection. `null`/absent when no recipient-selection UI was shown. Iframe-driven persistence — no PropStream action required.
      type: object
      required:
      - product_id
      - pieces
      title: PartnerOrderCreateRequest
    SenderInfo:
      properties:
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        company:
          anyOf:
          - type: string
          - type: 'null'
          title: Company
        address:
          anyOf:
          - type: string
          - type: 'null'
          title: Address
        city:
          anyOf:
          - type: string
          - type: 'null'
          title: City
        state:
          anyOf:
          - type: string
          - type: 'null'
          title: State
        zip:
          anyOf:
          - type: string
          - type: 'null'
          title: Zip
        phone:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone
        website:
          anyOf:
          - type: string
          - type: 'null'
          title: Website
      type: object
      title: SenderInfo
    CustomerInfo:
      properties:
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        website:
          anyOf:
          - type: string
          - type: 'null'
          title: Website
        rma:
          anyOf:
          - type: string
          - type: 'null'
          title: Rma
        phone:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone
        shipping_address:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Shipping Address
          description: 'Shipping address: {address, city, state, zip}'
      type: object
      title: CustomerInfo
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
security:
- bearerAuth: []
- partnerKeyAuth: []
paths:
  /v1/billing/orders/{order_id}:
    get:
      tags:
      - Orders
      summary: Get order
      description: 'Retrieve a single order by `order_id`. Tenant-scoped: partners only see their own orders; live/test accounts only see orders on their own `account_id`. Cross-tenant or missing `order_id` both return `404` (never `403`) so order existence cannot be probed across tenants. Response shape matches each element of `GET /v1/billing/orders`.'
      operationId: getOrder
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Order details
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Order not found (also returned for cross-tenant lookups)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/billing/orders/{order_id}/reschedule:
    post:
      tags:
      - Orders
      summary: Reschedule order (same-order)
      description: Update an order's scheduled mail date without creating a replacement order. Allowed only when `production_status='scheduled'` AND `payment_confirmed=FALSE`. The same `order_id` is preserved; the backend recomputes `scheduled_production_date` from the product SLA (in business days, Mon–Fri; see `API_KIT.md §6q` for per-product table). Idempotent on no-op (when the supplied `mail_date` equals the order's current value, the call returns 200 with no webhook/audit side-effects). See `API_KIT.md §6m` for the full contract and `order.rescheduled` webhook event payload.
      operationId: rescheduleOrder
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - mail_date
              properties:
                mail_date:
                  type: string
                  format: date
                  description: New mail date, `YYYY-MM-DD`. Interpreted at UTC midnight.
                  example: '2026-08-15'
      responses:
        '200':
          description: Order rescheduled. If `previous_mail_date == new_mail_date` this is an idempotent no-op (no webhook fired, no audit row written).
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                type: object
                required:
                - order_id
                - new_mail_date
                - new_scheduled_production_date
                properties:
                  order_id:
                    type: string
                  previous_mail_date:
                    type: string
                    format: date
                    nullable: true
                  new_mail_date:
                    type: string
                    format: date
                  previous_scheduled_production_date:
                    type: string
                    format: date-time
                    nullable: true
                  new_scheduled_production_date:
                    type: string
                    format: date-time
        '400':
          description: 'Validation failure. `error.code` values: `MAIL_DATE_INVALID_FORMAT` (not `YYYY-MM-DD`), `MAIL_DATE_TOO_SOON` (`mail_date − SLA_days` is ≤ today + 1 day), `MAIL_DATE_TOO_FAR` (> 365 days in the future).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Order not found (also returned for cross-tenant lookups so order existence cannot be probed across tenants).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'Order is not in a reschedulable state. `error.code` values: `PAID_LOCKED` (`payment_confirmed=TRUE`), `SEND_NOW_PROCESSING` (`pending_payment` awaiting `/confirm-payment`), `IN_PRODUCTION` (status is accepted/prep/printing/writing/inserting/stamping/ shipping), `TERMINAL` (status is complete/cancelled/failed/ payment_failed), `STATE_CHANGED` (concurrent state transition between read and write; retry once).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/billing/campaigns/{campaign_id}/recipients:
    patch:
      tags:
      - Recipients
      summary: Campaign-level delta recipient add/remove across editable drops
      operationId: campaignDeltaRecipients
      description: 'Add/remove recipients across all editable drops in a campaign with one call. Delta-based: `added[]` upserts by `contact_id + address_type`, `removed[]` deletes by key, `remove_all` clears and replaces. Editable drops: status ∈ {scheduled, pending_payment} with payment_confirmed=false. Locked drops (accepted, in production, mailed, delivered, terminal) are skipped and reported in the response. Gated accounts only (requires_payment_confirmation=TRUE). See API_KIT.md §6p.'
      parameters:
      - name: campaign_id
        in: path
        required: true
        schema:
          type: string
        description: Ballpoint campaign ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                added:
                  type: array
                  maxItems: 10000
                  description: Recipients to add/upsert on each editable drop.
                  items:
                    type: object
                    required:
                    - contact_id
                    - address_type
                    - address
                    - city
                    - state
                    - zip
                    properties:
                      contact_id:
                        type: string
                        maxLength: 64
                        description: Partner-side unique recipient identifier.
                      address_type:
                        type: string
                        enum:
                        - PROPERTY
                        - MAILING
                        description: Combined with contact_id, forms the unique key.
                      first_name:
                        type: string
                        nullable: true
                        description: At least one of first_name or last_name required.
                      last_name:
                        type: string
                        nullable: true
                        description: At least one of first_name or last_name required.
                      company:
                        type: string
                        nullable: true
                      address:
                        type: string
                        description: Street address line 1.
                      address2:
                        type: string
                        nullable: true
                      city:
                        type: string
                      state:
                        type: string
                        minLength: 2
                        maxLength: 2
                        description: 2-letter state code (uppercase).
                      zip:
                        type: string
                        description: 5 or 5+4 digit ZIP code.
                removed:
                  type: array
                  maxItems: 10000
                  description: Recipients to remove from each editable drop by unique key.
                  items:
                    type: object
                    required:
                    - contact_id
                    - address_type
                    properties:
                      contact_id:
                        type: string
                        maxLength: 64
                      address_type:
                        type: string
                        enum:
                        - PROPERTY
                        - MAILING
                remove_all:
                  type: boolean
                  default: false
                  description: If true, clears all recipients from editable drops before applying added[]. Cannot be combined with removed[] (422).
      responses:
        '200':
          description: Delta applied to all editable drops.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                type: object
                required:
                - campaign_id
                - added_count
                - removed_count
                - removed_not_found_count
                - drops_affected
                - drops_locked
                properties:
                  campaign_id:
                    type: string
                    description: The campaign that was modified.
                  added_count:
                    type: integer
                    description: Number of recipient keys in the added[] request (includes upserts).
                  removed_count:
                    type: integer
                    description: Keys from removed[] that matched at least one recipient across editable drops.
                  removed_not_found_count:
                    type: integer
                    description: Keys from removed[] that matched zero recipients. removed_count + removed_not_found_count = len(removed[]).
                  drops_affected:
                    type: array
                    description: Drops that were successfully mutated.
                    items:
                      type: object
                      required:
                      - order_id
                      - previous_piece_count
                      - new_piece_count
                      - new_total_price_tcents
                      - payment_confirmed
                      properties:
                        order_id:
                          type: string
                        previous_piece_count:
                          type: integer
                        new_piece_count:
                          type: integer
                          description: Per-drop source of truth for recipient count after mutation.
                        previous_total_price_tcents:
                          type: integer
                          nullable: true
                          description: Nullable for gated unconfirmed orders not yet priced.
                        new_total_price_tcents:
                          type: integer
                          description: Always computed via current pricing tables. Non-null.
                        payment_confirmed:
                          type: boolean
                          description: Always false (editable drops are by definition unconfirmed).
                  drops_locked:
                    type: array
                    description: Drops skipped because they are past the editable window.
                    items:
                      type: object
                      required:
                      - order_id
                      - locked_reason
                      - current_status
                      properties:
                        order_id:
                          type: string
                        locked_reason:
                          type: string
                          enum:
                          - paid_or_accepted
                          - in_production
                          - mailed
                          - delivered
                          - terminal
                          description: paid_or_accepted = payment_confirmed=true OR status=accepted. in_production = prep/printing/writing/inserting/stamping/shipping. mailed = complete. delivered = shipped/in_transit/out_for_delivery/delivered. terminal = cancelled/failed/payment_failed.
                        current_status:
                          type: string
                          description: The drop's current production status.
        '400':
          description: No pricing found for product/postage at the new piece count. error.code = NO_PRICING.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Campaign not found (also returned for cross-tenant lookups). error.code = CAMPAIGN_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'error.code values: PAYMENT_GATE_NOT_ACTIVE (account not gated), NO_EDITABLE_DROPS (all orders in campaign are locked).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation failure. Empty request, remove_all+removed[] conflict, duplicate keys in added[]/removed[], invalid recipient fields, or invalid address_type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/billing/campaigns/preview:
    post:
      tags:
      - Campaigns
      summary: Campaign-level cost preview (server-to-server)
      description: 'Server-to-server cost preview for a set of already-persisted orders that share the same campaign. Reads the persisted order inputs (no recomputation from raw inputs) and returns per-order pricing plus a single authoritative wholesale total to debit. `partner_cost_total_tcents` is the source of truth for what the partner is charged; `total_tcents` is display/retail and MUST NOT be used for debit. Replaces the prior per-order N-call preview pattern with a single call. Orders that are not chargeable right now (already confirmed, cancelled, failed, payment_failed, or otherwise not in a chargeable state) are still returned in `orders[]` with `excluded_from_totals=true` and an `exclusion_reason`, but are NOT added to `campaign_partner_cost_total_tcents`. Partner-only (non-partner principals receive `401`). Gated accounts only (`requires_payment_confirmation=TRUE`).'
      operationId: previewCampaignCost
      security:
      - partnerKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - order_ids
              - expected_order_count
              properties:
                order_ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  description: Persisted order IDs to preview. All orders MUST belong to the same campaign (mixed `campaign_id` values are rejected with `400 MIXED_CAMPAIGN_IDS`). Duplicates are rejected with `422 ORDER_IDS_DUPLICATE`.
                  items:
                    type: string
                expected_order_count:
                  type: integer
                  description: Expected length of `order_ids`. Used as a guard-rail against partial/truncated client payloads; mismatch with `len(order_ids)` returns `400 ORDER_COUNT_MISMATCH`.
      responses:
        '200':
          description: 'Per-order preview plus authoritative campaign-level wholesale total. Use `campaign_partner_cost_total_tcents` for the debit amount.'
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/X-Trace-Id'
          content:
            application/json:
              schema:
                type: object
                required:
                - campaign_id
                - currency
                - order_ids
                - orders
                - campaign_partner_cost_total_tcents
                properties:
                  campaign_id:
                    type: string
                    description: The single campaign all `order_ids` belong to.
                  currency:
                    type: string
                    enum:
                    - USD
                  order_ids:
                    type: array
                    description: Echo of the requested `order_ids` (same order).
                    items:
                      type: string
                  orders:
                    type: array
                    description: Per-order preview rows. Includes both chargeable-now and excluded orders; only chargeable-now rows are summed into `campaign_partner_cost_total_tcents`.
                    items:
                      type: object
                      required:
                      - order_id
                      - production_status
                      - payment_confirmed
                      - product_type
                      - postage_type
                      - piece_count
                      - unit_price_tcents
                      - total_tcents
                      - partner_cost_unit_price_tcents
                      - partner_cost_total_tcents
                      - price_source
                      - excluded_from_totals
                      - exclusion_reason
                      properties:
                        order_id:
                          type: string
                        production_status:
                          type: string
                        payment_confirmed:
                          type: boolean
                        product_type:
                          type: string
                        postage_type:
                          type: string
                        piece_count:
                          type: integer
                        unit_price_tcents:
                          type: integer
                          description: Display/retail unit price in tenths of a cent. NOT the partner debit amount.
                        total_tcents:
                          type: integer
                          description: Display/retail total in tenths of a cent. NOT the partner debit amount.
                        partner_cost_unit_price_tcents:
                          type: integer
                          description: Wholesale partner-cost unit price in tenths of a cent.
                        partner_cost_total_tcents:
                          type: integer
                          description: AUTHORITATIVE wholesale partner-cost total for this order in tenths of a cent. Sum of these across chargeable-now orders equals `campaign_partner_cost_total_tcents`.
                        price_source:
                          type: string
                          enum:
                          - frozen
                          - computed_from_persisted_order_inputs
                          description: '`frozen` = price snapshot persisted on the order is reused as-is. `computed_from_persisted_order_inputs` = recomputed from the persisted product/postage/piece_count inputs using current pricing tables (no raw client inputs accepted).'
                        excluded_from_totals:
                          type: boolean
                          description: '`true` when the order is not chargeable right now and its `partner_cost_total_tcents` is NOT included in `campaign_partner_cost_total_tcents`.'
                        exclusion_reason:
                          type: string
                          nullable: true
                          description: 'Why the order was excluded from totals. `null` for chargeable-now orders. Values: `already_confirmed` (payment_confirmed=true), `cancelled`, `failed`, `payment_failed`, `not_chargeable_status` (any other status not in the chargeable set).'
                  campaign_partner_cost_total_tcents:
                    type: integer
                    description: AUTHORITATIVE wholesale debit total for this preview, in tenths of a cent. Sums `partner_cost_total_tcents` across orders with `excluded_from_totals=false` only. This is the amount to charge the partner.
        '400':
          description: 'Validation failure. `error.code` values: `ORDER_COUNT_MISMATCH` (`expected_order_count` != `len(order_ids)`), `MIXED_CAMPAIGN_IDS` (orders span more than one campaign).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized. Endpoint requires `X-Partner-Key`; bearer/JWT principals receive `401`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 'One or more `order_ids` could not be found (also returned for cross-tenant lookups so order existence cannot be probed across tenants). `error.code` = `ORDER_NOT_FOUND`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'Account is not gated for payment confirmation. `error.code` = `PAYMENT_GATE_NOT_ACTIVE` (requires `requires_payment_confirmation=TRUE`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 'Validation failure on `order_ids`. `error.code` values: `ORDER_IDS_EMPTY` (empty array), `ORDER_IDS_DUPLICATE` (duplicate IDs in the array), `ORDER_IDS_LIMIT_EXCEEDED` (more than 100 IDs).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
