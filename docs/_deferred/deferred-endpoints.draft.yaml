openapi: 3.1.0
info:
  title: "Ballpoint API \u2014 DEFERRED / NOT-IN-STAGING endpoints (DO NOT PUBLISH)"
  version: deferred-2026-05-29
  description: 'Endpoints removed from the public staging/v1 spec on 2026-05-29 because they have NO real
    route in ballpoint-api staging. Preserved here to retain product intent. Each is pending a product/engineering
    decision: roadmap (v2) vs necessary-but-unimplemented gap. NOT a published contract. See README.md.'
paths:
  /v1/campaigns:
    post:
      tags:
      - Campaigns
      summary: Create campaign
      operationId: createCampaign
      parameters:
      - name: Idempotency-Key
        in: header
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignCreate'
      responses:
        '201':
          description: Campaign created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
    get:
      tags:
      - Campaigns
      summary: List campaigns
      operationId: listCampaigns
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - draft
          - upload_received
          - processing
          - needs_action
          - ready
          - queued
          - in_production
          - mailed
          - completed
          - failed
          - canceled
      - name: status_external
        in: query
        schema:
          type: string
          enum:
          - processing
          - action_required
          - ready
          - in_production
          - in_transit
          - completed
          - failed
          - canceled
      - name: source
        in: query
        schema:
          type: string
      - name: external_account_id
        in: query
        schema:
          type: string
      - name: external_user_id
        in: query
        schema:
          type: string
      - name: external_id
        in: query
        schema:
          type: string
      - name: created_after
        in: query
        schema:
          type: string
          format: date-time
      - name: created_before
        in: query
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: List of campaigns
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignList'
  /v1/campaigns/{campaign_id}:
    get:
      tags:
      - Campaigns
      summary: Get campaign
      operationId: getCampaign
      parameters:
      - name: campaign_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Campaign details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
  /v1/campaigns/{campaign_id}/submit:
    post:
      tags:
      - Campaigns
      summary: Submit campaign
      operationId: submitCampaign
      parameters:
      - name: campaign_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Campaign submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '400':
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/campaigns/{campaign_id}/cancel:
    post:
      tags:
      - Campaigns
      summary: Cancel campaign
      operationId: cancelCampaign
      parameters:
      - name: campaign_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Campaign cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
  /v1/reconciliation/campaigns/{campaign_id}:
    get:
      tags:
      - Reconciliation
      summary: Get campaign reconciliation
      operationId: reconcileCampaign
      parameters:
      - name: campaign_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Campaign reconciliation data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignReconciliation'
  /v1/reconciliation/campaigns/lookup:
    get:
      tags:
      - Reconciliation
      summary: Lookup campaign by external ID
      operationId: lookupCampaign
      parameters:
      - name: source
        in: query
        required: true
        schema:
          type: string
      - name: external_id
        in: query
        required: true
        schema:
          type: string
      - name: external_account_id
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Campaign reconciliation data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignReconciliation'
        '400':
          description: Ambiguous lookup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmbiguousLookup'
  /v1/reconciliation/webhooks/replay/{event_id}:
    post:
      tags:
      - Reconciliation
      summary: Replay webhook event
      operationId: replayWebhook
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                webhook_id:
                  type: string
      responses:
        '200':
          description: Replay results
          content:
            application/json:
              schema:
                type: object
                properties:
                  event_id:
                    type: string
                  deliveries:
                    type: array
                    items:
                      type: object
  /v1/webhooks:
    post:
      tags:
      - Webhooks
      summary: Register webhook
      operationId: createWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookCreate'
      responses:
        '201':
          description: Webhook created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
    get:
      tags:
      - Webhooks
      summary: List webhooks
      operationId: listWebhooks
      responses:
        '200':
          description: List of webhooks
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Webhook'
  /v1/webhooks/{webhook_id}/rotate-secret:
    post:
      tags:
      - Webhooks
      summary: Rotate webhook secret
      operationId: rotateWebhookSecret
      parameters:
      - name: webhook_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                overlap_days:
                  type: integer
                  default: 7
      responses:
        '200':
          description: Secret rotated
          content:
            application/json:
              schema:
                type: object
                properties:
                  new_secret:
                    type: string
                  previous_secret_expires_at:
                    type: string
                    format: date-time
  /v1/webhooks/{webhook_id}/pause:
    post:
      tags:
      - Webhooks
      summary: Pause webhook
      operationId: pauseWebhook
      parameters:
      - name: webhook_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Webhook paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
  /v1/webhooks/{webhook_id}/resume:
    post:
      tags:
      - Webhooks
      summary: Resume webhook
      operationId: resumeWebhook
      parameters:
      - name: webhook_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Webhook resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
  /v1/webhooks/{webhook_id}/health:
    get:
      tags:
      - Webhooks
      summary: Get webhook health
      operationId: getWebhookHealth
      parameters:
      - name: webhook_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Webhook health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
  /v1/sandbox/webhooks/{webhook_id}/trigger:
    post:
      tags:
      - Sandbox
      summary: Trigger test webhook
      operationId: triggerTestWebhook
      parameters:
      - name: webhook_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - event_type
              properties:
                event_type:
                  type: string
      responses:
        '200':
          description: Trigger result
          content:
            application/json:
              schema:
                type: object
  /v1/sandbox/webhooks/{webhook_id}/test-signature:
    get:
      tags:
      - Sandbox
      summary: Test signature verification
      operationId: testSignature
      parameters:
      - name: webhook_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Test payload with signature
          content:
            application/json:
              schema:
                type: object
components:
  schemas:
    AmbiguousLookup:
      allOf:
      - $ref: '#/components/schemas/Error'
      description: 'Returned when a lookup by external_id is ambiguous without external_account_id.


        **Resolution**: Include external_account_id in query.

        '
    Campaign:
      allOf:
      - $ref: '#/components/schemas/CampaignCreate'
      - type: object
        properties:
          id:
            type: string
            pattern: ^cmp_[a-zA-Z0-9]+$
          account_id:
            type: string
          status:
            type: string
            enum:
            - draft
            - upload_received
            - processing
            - needs_action
            - ready
            - queued
            - in_production
            - mailed
            - completed
            - failed
            - canceled
            description: Internal status
          status_external:
            type: string
            enum:
            - processing
            - action_required
            - ready
            - in_production
            - in_transit
            - completed
            - failed
            - canceled
            description: Simplified status for partners
          integration:
            $ref: '#/components/schemas/IntegrationIdentity'
          recipient_count:
            type: integer
          valid_count:
            type: integer
          invalid_count:
            type: integer
          created_at:
            type: string
            format: date-time
          updated_at:
            type: string
            format: date-time
    CampaignCreate:
      type: object
      required:
      - name
      - product_type
      properties:
        name:
          type: string
          maxLength: 200
        product_type:
          type: string
          description: 'Mail piece type. See Order schema for full descriptions.

            All postcards require **1/8" bleed** on all sides.

            '
          enum:
          - 4x6_printed
          - 6x9_printed
          - 4x6_cursive
          - 6x9_cursive
          - color_letter
          - greeting_letter
          - hybrid_letter
        postage_type:
          type: string
          enum:
          - first_class
          - standard
          - presort
          default: presort
        source:
          type: string
          maxLength: 50
        external_account_id:
          type: string
          maxLength: 100
        external_user_id:
          type: string
          maxLength: 100
        external_id:
          type: string
          maxLength: 100
        metadata:
          type: object
          additionalProperties:
            type: string
    CampaignList:
      type: object
      properties:
        object:
          type: string
          enum:
          - list
        data:
          type: array
          items:
            $ref: '#/components/schemas/Campaign'
        has_more:
          type: boolean
        next_cursor:
          type: string
    CampaignReconciliation:
      type: object
      properties:
        campaign:
          $ref: '#/components/schemas/Campaign'
        events:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              event_type:
                type: string
              from_status:
                type: string
              to_status:
                type: string
              actor_type:
                type: string
              actor_id:
                type: string
              metadata:
                type: object
              created_at:
                type: string
                format: date-time
        webhook_deliveries:
          type: array
          items:
            type: object
            properties:
              event_id:
                type: string
              event_type:
                type: string
              webhook_url:
                type: string
              status:
                type: string
                enum:
                - success
                - failed
                - retrying
              attempt_number:
                type: integer
              response_status:
                type: integer
              delivered_at:
                type: string
                format: date-time
        resolution:
          type: object
          properties:
            current_status:
              type: string
            is_terminal:
              type: boolean
            can_cancel:
              type: boolean
            allowed_transitions:
              type: array
              items:
                type: string
            next_steps:
              type: array
              items:
                type: string
            support_hint:
              type: string
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - type
          - code
          - message
          properties:
            type:
              type: string
              enum:
              - validation_error
              - authentication_error
              - authorization_error
              - not_found
              - conflict
              - rate_limit_error
              - server_error
            code:
              type: string
              description: Machine-readable error code
              enum:
              - INVALID_ADDRESS
              - ADDRESS_UNDELIVERABLE
              - INVALID_PDF
              - INVALID_STATUS_TRANSITION
              - AMBIGUOUS_LOOKUP
              - IDEMPOTENCY_CONFLICT
              - INSUFFICIENT_BALANCE
              - RATE_LIMITED
              - NOT_FOUND
              - UNAUTHORIZED
              - FORBIDDEN
            message:
              type: string
              description: Human-readable error message
            details:
              type: object
              description: Additional error context
            trace_id:
              type: string
              description: Request trace ID for support
    IntegrationIdentity:
      type: object
      description: Partner integration identity fields
      properties:
        source:
          type: string
          maxLength: 50
          description: Integration source identifier
          example: your_source
        external_account_id:
          type: string
          maxLength: 100
          description: Partner's tenant/customer ID
          example: tenant_12345
        external_user_id:
          type: string
          maxLength: 100
          description: Partner's user ID within tenant
          example: user_789
        external_id:
          type: string
          maxLength: 100
          description: Partner's ID for this resource
          example: campaign_abc
    Webhook:
      allOf:
      - $ref: '#/components/schemas/WebhookCreate'
      - type: object
        properties:
          id:
            type: string
            pattern: ^whk_[a-zA-Z0-9]+$
          secret:
            type: string
            description: HMAC signing secret (only shown on create)
          api_version:
            type: string
            description: Webhook payload version
            example: '2026-02-01'
          is_enabled:
            type: boolean
          is_paused:
            type: boolean
          health_status:
            type: string
            enum:
            - healthy
            - degraded
            - unhealthy
            - paused
            - disabled
            - unknown
          consecutive_failures:
            type: integer
          success_rate:
            type: number
          created_at:
            type: string
            format: date-time
    WebhookCreate:
      type: object
      required:
      - url
      - events
      properties:
        url:
          type: string
          format: uri
          description: HTTPS URL for webhook delivery
        events:
          type: array
          items:
            type: string
            enum:
            - campaign.created
            - campaign.processing
            - campaign.ready
            - campaign.needs_action
            - campaign.queued
            - campaign.in_production
            - campaign.mailed
            - campaign.completed
            - campaign.failed
            - campaign.canceled
            - order.created
            - order.validated
            - order.queued
            - order.shipped
            - order.delivered
            - order.failed
            - order.cancelled
        source:
          type: string
          description: Filter events by integration source
        external_account_id:
          type: string
          description: Filter events by partner tenant
